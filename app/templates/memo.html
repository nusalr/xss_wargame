{% extends "base.html" %}
{% block title %}Reflect Me · Memo{% endblock %}
{% block content %}
  <h1>Memo</h1>
  {% if notice %}<div class="notice info" role="status">{{ notice }}</div>{% endif %}
  {% if memos %}
    <ol class="memo-list">
      {% for item in memos %}<li><code>{{ item }}</code></li>{% endfor %}
    </ol>
  {% else %}
    <p class="empty-state"></p>
  {% endif %}
{% endblock %}
